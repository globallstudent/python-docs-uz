name: Lint

on:
  push:
  pull_request:

jobs:
  sphinx-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install sphinx-lint
      - run: sphinx-lint --enable all --disable line-too-long *.po */*.po
